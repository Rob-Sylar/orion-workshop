<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#04070d">
<link rel="icon" href="../../icons/icon-192.png">
<title>Career Tracker — Orion Workshop</title>
<style>
:root{--bg:#05080f;--panel:#0b1220;--panel2:#0f1a2e;--line:#1c2b48;--cyan:#3ee6ff;--amber:#ffb547;--green:#4dff9a;--red:#ff5d6c;--text:#d8e6ff;--dim:#7d93b8;--mono:ui-monospace,Consolas,monospace;--acc:var(--cyan)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background-image:radial-gradient(circle at 20% -10%,#0d2a44 0,transparent 45%);background-attachment:fixed}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px}
a.back{color:var(--dim);text-decoration:none;font:13px var(--mono)}
.tag{font:600 12px var(--mono);letter-spacing:.2em;color:var(--acc);margin-top:14px;text-transform:uppercase}
h1{font:800 clamp(28px,8vw,42px)/1.05 system-ui,sans-serif;margin:6px 0 4px;text-transform:uppercase}
h1 span{color:var(--acc);text-shadow:0 0 20px var(--acc)}
h2{font:800 19px/1.25 system-ui,sans-serif;margin:0 0 10px}
h3{font:700 16px system-ui;margin:0 0 6px}
p.sub{color:var(--dim);margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label.f{display:block;font:600 12px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:16px system-ui,sans-serif;padding:12px;min-height:48px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(62,230,255,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border:0;border-radius:10px;background:var(--acc);color:#021018;font:800 15px system-ui;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--dim)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn.danger{background:none;border:1px solid #5a2030;color:var(--red)}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{display:block;font:600 11px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.stat b{font:800 22px system-ui;color:var(--acc)}
.bar{height:12px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);box-shadow:0 0 10px var(--acc);transition:width .4s}
.prog{display:flex;justify-content:space-between;font:600 13px var(--mono);color:var(--dim);margin-bottom:6px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{appearance:none;flex:0 0 26px;width:26px;height:26px;min-height:26px;padding:0;border:2px solid var(--acc);border-radius:7px;margin-top:1px;cursor:pointer;position:relative;background:#06101c}
.chk input:checked{background:var(--green);border-color:var(--green)}
.chk input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#041;font-weight:900}
.chk.done span{color:var(--dim);text-decoration:line-through}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto;min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:700 14px system-ui;cursor:pointer}
.tabs button.on{background:var(--acc);color:#021018;border-color:var(--acc)}
.pill{display:inline-block;font:700 11px var(--mono);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.pill.g{color:var(--green);border-color:#1f5e44}.pill.a{color:var(--amber);border-color:#5e4a1f}.pill.r{color:var(--red);border-color:#5a2030}.pill.c{color:var(--cyan);border-color:#1f4a5e}
.muted{color:var(--dim);font-size:14px}
.note{border-left:3px solid var(--amber);background:#1a1407;padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0;color:#f3dcb0;font-size:14px}
.empty{color:var(--dim);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:12px}
.list .item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0}
details>summary{list-style:none;cursor:pointer;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";color:var(--acc);font-weight:900}
details[open]>summary::after{content:"－"}
details .in{padding:0 16px 16px}
@media (max-width:420px){.grid2{grid-template-columns:1fr 1fr}.stat b{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../../">← Hub</a>
<div class="tag">// Career</div>
<h1>Career <span>Tracker</span></h1>
<p class="sub">Job applications, courses and certs, skills and goals in one place. Saved on this device.</p>
<div class="card"><div class="grid2" id="dash"></div></div>
<div class="tabs" id="tabs"><button data-t="apps" class="on">Applications</button><button data-t="learn">Courses</button><button data-t="skills">Skills</button><button data-t="goals">Goals</button></div>
<div id="view"></div>
<div class="card"><div class="row"><button class="btn ghost small" id="exp">Copy backup</button><button class="btn ghost small" id="imp">Restore backup</button></div><p class="muted" id="msg"></p></div>
</div>
<script>
(function(){
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ukDate(s){if(!s)return '';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
var K='orion-career-tracker-v1';
var S=load(K,{apps:[],learn:[],skills:[],goals:[]});
['apps','learn','skills','goals'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[];});
var tab='apps';
var STAT=['applied','interview','offer','rejected'];
var PILL={applied:'c',interview:'a',offer:'g',rejected:'r'};
function commit(){save(K,S);render();}
function pct(n){n=+n;return isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):0;}
function avg(a,f){return a.length?Math.round(a.reduce(function(s,x){return s+pct(x[f]);},0)/a.length):0;}
function stat(l,v){return '<div class="stat"><small>'+l+'</small><b>'+v+'</b></div>';}
function dash(){
  var c={applied:0,interview:0,offer:0,rejected:0};S.apps.forEach(function(a){if(c[a.status]!=null)c[a.status]++;});
  var sk=S.skills.filter(function(x){return x.done;}).length;
  $('dash').innerHTML=stat('Applications',S.apps.length)+stat('Interviews',c.interview)+stat('Offers',c.offer)+stat('Rejected',c.rejected)+stat('Course progress',avg(S.learn,'p')+'%')+stat('Skills ticked',sk+' / '+S.skills.length)+stat('Goals progress',avg(S.goals,'p')+'%')+stat('Waiting',c.applied);
}
function bar(p){return '<div class="bar" style="margin-top:6px"><i style="width:'+p+'%"></i></div>';}
function viewApps(){
  var h='<div class="card"><h2>Log an application</h2><label class="f">Company</label><input id="a_co" maxlength="80"><label class="f">Role</label><input id="a_ro" maxlength="80"><div class="grid2"><div><label class="f">Date applied</label><input id="a_dt" type="date" value="'+today()+'"></div><div><label class="f">Status</label><select id="a_st">'+STAT.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select></div></div><br><button class="btn full" id="a_add">Add application</button></div>';
  h+='<div class="card"><h2>Applications</h2>';
  if(!S.apps.length)h+='<div class="empty">None yet. Add your first one above.</div>';
  else h+='<div class="list">'+S.apps.slice().sort(function(a,b){return (b.date||'')>(a.date||'')?1:-1;}).map(function(a){return '<div class="item" style="flex-wrap:wrap"><div style="flex:1 1 180px"><b>'+esc(a.company)+'</b><br><span class="muted">'+esc(a.role)+' · '+ukDate(a.date)+'</span></div><select data-st="'+a.id+'" style="flex:0 0 130px">'+STAT.map(function(s){return '<option'+(s===a.status?' selected':'')+'>'+s+'</option>';}).join('')+'</select><button class="btn danger small" data-del="apps:'+a.id+'">✕</button></div>';}).join('')+'</div>';
  return h+'</div>';
}
function viewProg(key,label,ph){
  var h='<div class="card"><h2>Add '+label+'</h2><label class="f">Name</label><input id="p_n" maxlength="100" placeholder="'+ph+'"><label class="f">Target / notes (optional)</label><input id="p_x" maxlength="100"><br><br><button class="btn full" id="p_add">Add</button></div><div class="card"><h2>'+label+'s</h2>';
  if(!S[key].length)h+='<div class="empty">Nothing here yet.</div>';
  else h+=S[key].map(function(x){return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="flex-wrap:nowrap"><b style="flex:1">'+esc(x.name)+'</b><span class="pill c" style="flex:0 0 auto">'+pct(x.p)+'%</span><button class="btn danger small" style="flex:0 0 auto" data-del="'+key+':'+x.id+'">✕</button></div>'+(x.extra?'<div class="muted">'+esc(x.extra)+'</div>':'')+bar(pct(x.p))+'<input type="range" min="0" max="100" step="5" value="'+pct(x.p)+'" data-rg="'+key+':'+x.id+'" style="margin-top:6px;padding:0;min-height:32px"></div>';}).join('');
  return h+'</div>';
}
function viewSkills(){
  var h='<div class="card"><h2>Add a skill</h2><div class="row"><input id="s_n" maxlength="80" placeholder="e.g. Python basics"><button class="btn" id="s_add" style="flex:0 0 auto">Add</button></div></div><div class="card"><h2>Skills checklist</h2>';
  var n=S.skills.filter(function(x){return x.done;}).length;
  h+='<div class="prog"><span>'+n+' / '+S.skills.length+'</span><span>'+(S.skills.length?Math.round(n/S.skills.length*100):0)+'%</span></div>'+bar(S.skills.length?n/S.skills.length*100:0);
  if(!S.skills.length)h+='<div class="empty" style="margin-top:10px">No skills yet.</div>';
  else h+=S.skills.map(function(x){return '<div class="chk'+(x.done?' done':'')+'"><input type="checkbox" data-sk="'+x.id+'"'+(x.done?' checked':'')+'><span style="flex:1">'+esc(x.name)+'</span><button class="btn danger small" data-del="skills:'+x.id+'">✕</button></div>';}).join('');
  return h+'</div>';
}
function viewGoals(){
  var h='<div class="card"><h2>Add a goal</h2><label class="f">Goal</label><input id="g_n" maxlength="100" placeholder="e.g. Pass Security+"><label class="f">Target date</label><input id="g_d" type="date"><br><br><button class="btn full" id="g_add">Add goal</button></div><div class="card"><h2>Goals</h2>';
  if(!S.goals.length)h+='<div class="empty">No goals yet.</div>';
  else h+=S.goals.map(function(x){var left='';if(x.date){var d=Math.ceil((new Date(x.date+'T00:00:00')-new Date())/864e5);left=d<0?'<span class="pill r">'+(-d)+' days overdue</span>':'<span class="pill a">'+d+' days left</span>';}
    return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="flex-wrap:nowrap"><b style="flex:1">'+esc(x.name)+'</b><span class="pill c" style="flex:0 0 auto">'+pct(x.p)+'%</span><button class="btn danger small" style="flex:0 0 auto" data-del="goals:'+x.id+'">✕</button></div><div class="muted">'+(x.date?'Target '+ukDate(x.date)+' ':'')+left+'</div>'+bar(pct(x.p))+'<input type="range" min="0" max="100" step="5" value="'+pct(x.p)+'" data-rg="goals:'+x.id+'" style="margin-top:6px;padding:0;min-height:32px"></div>';}).join('');
  return h+'</div>';
}
function render(){
  dash();
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.t===tab);});
  $('view').innerHTML=tab==='apps'?viewApps():tab==='learn'?viewProg('learn','course or certification','e.g. CompTIA Security+'):tab==='skills'?viewSkills():viewGoals();
}
function val(id){var e=$(id);return e?e.value.trim():'';}
function find(key,id){return S[key].filter(function(x){return x.id===id;})[0];}
$('tabs').addEventListener('click',function(e){if(e.target.dataset.t){tab=e.target.dataset.t;render();}});
$('view').addEventListener('click',function(e){
  var t=e.target,id=t.id;
  if(id==='a_add'){if(!val('a_co'))return;S.apps.push({id:uid(),company:val('a_co'),role:val('a_ro'),date:val('a_dt'),status:val('a_st')});commit();}
  else if(id==='p_add'){if(!val('p_n'))return;S.learn.push({id:uid(),name:val('p_n'),extra:val('p_x'),p:0});commit();}
  else if(id==='s_add'){if(!val('s_n'))return;S.skills.push({id:uid(),name:val('s_n'),done:false});commit();}
  else if(id==='g_add'){if(!val('g_n'))return;S.goals.push({id:uid(),name:val('g_n'),date:val('g_d'),p:0});commit();}
  else if(t.dataset.del){var p=t.dataset.del.split(':');if(confirm('Remove this?')){S[p[0]]=S[p[0]].filter(function(x){return x.id!==p[1];});commit();}}
});
$('view').addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.st){var a=find('apps',t.dataset.st);if(a){a.status=t.value;commit();}}
  else if(t.dataset.sk){var s=find('skills',t.dataset.sk);if(s){s.done=t.checked;commit();}}
});
$('view').addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.rg){var p=t.dataset.rg.split(':'),x=find(p[0],p[1]);if(x){x.p=+t.value;save(K,S);dash();var c=t.parentNode;c.querySelector('.pill').textContent=x.p+'%';c.querySelector('.bar i').style.width=x.p+'%';}}
});
$('exp').addEventListener('click',function(){var j=JSON.stringify(S);try{navigator.clipboard.writeText(j).then(function(){$('msg').textContent='Backup copied. Paste it somewhere safe (but not into a public place, it has your job search).';},function(){$('msg').textContent='Could not copy.';});}catch(e){$('msg').textContent='Could not copy.';}});
$('imp').addEventListener('click',function(){var j=prompt('Paste your backup text:');if(!j)return;try{var o=JSON.parse(j);['apps','learn','skills','goals'].forEach(function(k){if(!Array.isArray(o[k]))throw 0;});S=o;commit();$('msg').textContent='Restored.';}catch(e){$('msg').textContent='That backup did not look right.';}});
render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../../sw.js').catch(function(){});});}</script>
</body>
</html>
